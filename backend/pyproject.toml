[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "field-force-incident-assistant"
version = "0.1.0"
description = "Local API for the Field Force Incident Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "alembic>=1.13,<2.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "httpx>=0.27,<1.0",
  "requests>=2.31,<3.0",
  "python-dotenv>=1.0,<2.0",
  "urllib3>=2.0,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
